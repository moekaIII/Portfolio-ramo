<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- DESIGN | BUILD: 花のつぼみの左半分はワイヤーフレーム、右半分は塗り（Hero の 3D と同じ構図） -->
  <defs>
    <linearGradient id="petal" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f29bb8"/>
      <stop offset="0.55" stop-color="#f6b3a0"/>
      <stop offset="1" stop-color="#f9d59c"/>
    </linearGradient>
    <path id="bud" d="M32 7C45 15 54 25 52 36C50.5 46 42 52 32 52C22 52 13.5 46 12 36C10 25 19 15 32 7Z"/>
    <clipPath id="left"><rect width="32" height="64"/></clipPath>
    <clipPath id="right"><rect x="32" width="32" height="64"/></clipPath>
    <clipPath id="inside"><use href="#bud"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="15" fill="#121316"/>
  <!-- 茎 -->
  <path d="M31 51C30 55 28 58 24.5 60.5" fill="none" stroke="#8aa673" stroke-width="3" stroke-linecap="round"/>
  <!-- BUILD: 塗り -->
  <use href="#bud" fill="url(#petal)" clip-path="url(#right)"/>
  <!-- DESIGN: ワイヤーフレーム -->
  <g clip-path="url(#left)" fill="none" stroke="#c8f04a" stroke-linejoin="round" stroke-linecap="round">
    <use href="#bud" stroke-width="2.6"/>
    <g clip-path="url(#inside)" stroke-width="1.6">
      <path d="M32 7L21 21L32 27L13 33L26 40L32 27M21 21L13 33M26 40L32 52M26 40L15 46M26 40L32 41"/>
    </g>
  </g>
  <!-- 境界線 -->
  <path d="M32 4v57" stroke="#f4f4f5" stroke-opacity="0.85" stroke-width="1.8"/>
</svg>
